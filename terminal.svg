<svg fill="none" viewBox="0 0 800 400" width="100%" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;padding:20px 40px 0;box-sizing:border-box;display:flex;justify-content:center;align-items:center;">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
        .window{width:100%;max-width:700px;border-radius:16px;background:linear-gradient(135deg,rgba(7,27,20,.95),rgba(3,15,12,1) 58%,rgba(4,26,30,.95));border:1px solid rgba(16,185,129,.3);box-shadow:0 15px 35px rgba(0,0,0,.5),0 0 0 1px rgba(6,182,212,.1),0 0 30px rgba(16,185,129,.15),inset 0 0 20px rgba(16,185,129,.05);font-family:'JetBrains Mono',monospace;overflow:hidden;}
        .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(16,185,129,.15);background:rgba(2,12,9,.6);}
        .dots{display:flex;gap:6px}.dot{width:12px;height:12px;border-radius:50%}.red{background:#ff5f57}.yellow{background:#ffbd2e}.green{background:#28c840}
        .title{font-size:11px;color:rgba(163,230,211,.65);letter-spacing:.22em}
        .status{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(16,185,129,.8)}.status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 10px rgba(16,185,129,.8)}
        .body{padding:24px;display:flex;font-size:12px;line-height:1.9;overflow:hidden}.gutter{display:flex;flex-direction:column;align-items:flex-end;padding-right:16px;color:#2d4a3e;user-select:none}.code{display:flex;flex-direction:column;min-width:0}
        .line{white-space:pre;opacity:0;transform:translateX(-8px);animation:reveal .4s ease forwards}
        @keyframes reveal{to{opacity:1;transform:translateX(0)}}
        .l1{animation-delay:.2s}.l2{animation-delay:.5s}.l3{animation-delay:.8s}.l4{animation-delay:1.1s}.l5{animation-delay:1.4s}.l6{animation-delay:1.7s}.l7{animation-delay:2s}.l8{animation-delay:2.3s}.l9{animation-delay:2.6s}.l10{animation-delay:2.9s}
        .cursor{display:inline-block;width:7px;height:14px;background:#10b981;vertical-align:middle;margin-left:4px;animation:blink 1s step-end infinite}
        @keyframes blink{50%{opacity:0}}
        .footer{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-top:1px solid rgba(16,185,129,.15);background:rgba(16,185,129,.09);color:#64748b;font-size:10px}
      </style>
      <div class="window">
        <div class="header">
          <div class="dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
          <div class="title">developer.js</div>
          <div class="status"><div class="status-dot"></div>status</div>
        </div>
        <div class="body">
          <div class="gutter">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
          </div>
          <div class="code">
            <div class="line l1" style="color:#e2e8f0;">const developer = {</div>
            <div class="line l2" style="color:#a3e6d3;">  name: "Muhammad Kholil",</div>
            <div class="line l3" style="color:#a3e6d3;">  role: "Aspiring Full-Stack Developer",</div>
            <div class="line l4" style="color:#a3e6d3;">  stack: ["PHP", "Laravel", "JavaScript"],</div>
            <div class="line l5" style="color:#93c5fd;">  database: ["MySQL"],</div>
            <div class="line l6" style="color:#f59e0b;">  learning: ["Kotlin", "Android"],</div>
            <div class="line l7" style="color:#e2e8f0;">  principle: "Learn, Build, Improve, Repeat.",</div>
            <div class="line l8" style="color:#c084fc;">  focus: "building useful digital solutions",</div>
            <div class="line l9" style="color:#e2e8f0;">  build: () =&gt; "turn ideas into reality"</div>
            <div class="line l10" style="color:#e2e8f0;">}<span class="cursor"></span></div>
          </div>
        </div>
        <div class="footer">
          <div style="display:flex;gap:12px;"><span style="color:#10b981;">⎇ main</span><span>Ln 10, Col 2</span></div>
          <div style="display:flex;gap:12px;"><span style="color:#10b981;">● Live</span><span>JavaScript</span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
